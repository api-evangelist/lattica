apis:
- aid: lattica:platform
  name: Lattica Platform API
  description: 'The LatticaAI platform API for deploying and operating encrypted workloads.
    An RPC-style HTTPS surface rooted at https://api.lattica.ai/api/, authenticated with
    a Bearer token, covering account and finance operations, model (workload) lifecycle,
    user access token management, worker/compute-resource control, and encrypted query
    execution. Consumed through the first-party Python (lattica-query, lattica-management)
    and TypeScript (@lattica-ai/query) client SDKs; Lattica does not publish an OpenAPI
    definition for the surface.'
