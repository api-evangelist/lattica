aid: lattica
name: Lattica
description: 'LatticaAI is an Israeli privacy-technology company building Fully Homomorphic
  Encryption (FHE) as a service, letting AI inference and database queries run on encrypted
  data at cloud scale with zero plaintext exposure. Lattica builds the full stack — the
  cryptography, a compiler that turns models into homomorphic-ready pipelines, and a
  GPU-accelerated FHE runtime called the Encrypted Execution Layer. Service providers
  deploy models and vector databases as workloads; end users query them through a Query
  Client that encrypts input on-device and decrypts results locally, so the server only
  ever sees ciphertext. HEAL (Homomorphic Encryption Abstraction Layer) bridges the FHE
  software stack to acceleration hardware.'
