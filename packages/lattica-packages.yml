    summary: Lattica management client.
    author_email: hello@lattica.ai
    role: >-
      Management Client — organization-admin SDK. Manages workloads (models),
      user access tokens, compute workers, and account/finance operations.
    docs: https://platformdocs.lattica.ai/how-to-guides/client-installation/how-to-install-management-client.md
    status: 200
    official: true
  - language: python
