description: >-
  First-party LatticaAI client libraries. The docs publish two install paths — a
  Python SDK (pip) and a TypeScript SDK (npm). Ownership was confirmed via the
  PyPI author_email field ("LatticaAI Inc." <support@lattica.ai> /
  <hello@lattica.ai>) and the @lattica-ai npm scope. IMPORTANT: the unscoped
  PyPI project `lattica` is an UNRELATED third-party P2P/DHT networking library
  and is explicitly recorded below as not official, so a later round does not
  mistake it for a Lattica SDK.
packages:
