    docs: https://platformdocs.lattica.ai/how-to-guides/client-installation/how-to-install-query-client.md
    status: 200
    official: true
    notes: >-
      The docs render the install as `npm install @Lattica-ai/query`; npm scopes
      are lower-cased, and only `@lattica-ai/query` resolves in the registry.
