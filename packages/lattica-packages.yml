    registry: pypi
    name: lattica-query
    version: '1.5.0'
    url: https://pypi.org/project/lattica-query/
    install: pip install lattica-query
    summary: Client package for running inference queries on the LatticaAI platform.
    author_email: support@lattica.ai
    requires_python: '>=3.11'
    role: >-
      Query Client — end-user SDK. Generates the secret/evaluation key pair,
      encrypts input on-device, submits the encrypted query, and decrypts the
      result locally.
    docs: https://platformdocs.lattica.ai/how-to-guides/client-installation/how-to-install-query-client.md
    status: 200
    official: true
